[[component]]
id = "type-family"
group = "typography"
api = 'font="DejaVu Serif"'
reference = "scenes#textobject"
title = "Sans and serif"
zh = "无衬线与衬线字体"
details = "DejaVu Sans and DejaVu Serif at the same size. Use Style.fontname for timed lyrics."
zh_details = "同字号的 DejaVu Sans 与 DejaVu Serif。带时间轴的歌词用 Style.fontname 选择字体。"

[[component]]
id = "type-size"
group = "typography"
api = "font_size=94"
reference = "scenes#textobject"
title = "Font size"
zh = "字号"
details = "69 versus 94 script pixels. The equivalent lyric style field is Style.fontsize."
zh_details = "对比 69 与 94 脚本像素。歌词样式的对应字段是 Style.fontsize。"

[[component]]
id = "type-bold"
group = "typography"
api = "bold=True"
reference = "documents#style"
title = "Regular and bold"
zh = "常规字重与粗体"
details = "Both sides use the same family and size. The right side requests the bold face."
zh_details = "左右使用相同字体和字号，右侧选择粗体字面。"

[[component]]
id = "type-italic"
group = "typography"
api = "italic=True"
reference = "documents#style"
title = "Upright and italic"
zh = "正体与斜体"
details = "The right side requests an italic or oblique face. Horizontal karaoke wipes also take on a default slant."
zh_details = "右侧选择斜体字面。横排歌词使用斜体时，走字前沿也会默认倾斜。"

[[component]]
id = "type-spacing"
group = "typography"
api = "spacing=18"
reference = "documents#style"
title = "Letter spacing"
zh = "字距"
details = "Add 18 script pixels of letter spacing while keeping the glyphs the same size."
zh_details = "增加 18 脚本像素的字距，字形大小保持一致。"

[[component]]
id = "type-scale"
group = "typography"
api = "scale=Vec2(0.78, 1.32)"
reference = "animation#visualstate"
title = "Horizontal and vertical scale"
zh = "横向与纵向缩放"
details = "Compress width to 78% and stretch height to 132%. Style.scale_x and scale_y take percentages."
zh_details = "宽度压到 78%，高度拉到 132%。Style.scale_x 和 scale_y 使用百分比。"

[[component]]
id = "type-border"
group = "typography"
api = "border=7"
reference = "animation#visualstate"
title = "Primary outline"
zh = "主描边"
details = "Add a purple 7 px outline. The corresponding lyric style field is Style.outline."
zh_details = "右侧加上 7 脚本像素的紫色主描边。歌词样式的对应字段是 Style.outline。"

[[component]]
id = "type-blur"
group = "typography"
api = "blur=9"
reference = "animation#visualstate"
title = "Blurred lettering"
zh = "字形模糊"
details = "The right side softens the lettering itself. Use Glow to add a separate halo around crisp text."
zh_details = "右侧把文字本身变柔。如果要让文字保持清晰、只在外面加柔光，可以用 Glow。"

[[component]]
id = "type-shadow"
group = "typography"
api = "shadow=Vec2(9, 12)"
reference = "animation#visualstate"
title = "Offset shadow"
zh = "偏移阴影"
details = "Offset the shadow 9 px to the right and 12 px down."
zh_details = "阴影向右偏移 9、向下偏移 12 脚本像素。"

[[component]]
id = "sweep-color"
group = "sweep"
api = 'scanline_mode="color"'
reference = "tracks#karaokeeffects"
title = "Solid-colour scanline"
zh = "单色扫描线"
details = 'The left is a plain wipe. The right uses highlight="scanline" and a cyan scanline_color.'
zh_details = '左侧是普通扫色，右侧使用 highlight="scanline" 并把 scanline_color 设成青色。'
still = 1.45

[[component]]
id = "sweep-brighten"
group = "sweep"
api = 'scanline_mode="brighten"'
reference = "tracks#karaokeeffects"
title = "Brighten both sides"
zh = "分别提亮前后色"
details = "The band lightens the waiting and sung colours independently, so both colours meet inside the band."
zh_details = "色带分别提亮唱前色和唱后色，两种颜色在带内交会。"
still = 1.45

[[component]]
id = "sweep-follow-before"
group = "sweep"
api = 'scanline_mode="follow_before"'
reference = "tracks#karaokeeffects"
title = "Follow the waiting colour"
zh = "跟随唱前色"
details = "The entire band takes its hue from the waiting side."
zh_details = "整条色带采用唱前侧的色相。"
still = 1.45

[[component]]
id = "sweep-follow-after"
group = "sweep"
api = 'scanline_mode="follow_after"'
reference = "tracks#karaokeeffects"
title = "Follow the sung colour"
zh = "跟随唱后色"
details = "The entire band takes its hue from the sung side."
zh_details = "整条色带采用唱后侧的色相。"
still = 1.45

[[component]]
id = "sweep-width"
group = "sweep"
api = "scanline_width=26"
reference = "tracks#karaokeeffects"
title = "Narrow and wide bands"
zh = "窄色带与宽色带"
details = "Compare a 9 px band with a 26 px band at the same speed."
zh_details = "在相同速度下对比 9 与 26 脚本像素的色带。"
still = 1.45

[[component]]
id = "sweep-softness"
group = "sweep"
api = "scanline_softness=13"
reference = "tracks#karaokeeffects"
title = "Hard and soft band edges"
zh = "扫描线硬边与柔边"
details = "Both bands are 26 px wide. Softness blends the band into the text on both edges."
zh_details = "两条色带都宽 26 脚本像素。右侧的色带在两边逐渐融入文字。"
still = 1.45

[[component]]
id = "sweep-strength"
group = "sweep"
api = "scanline_strength=0.35"
reference = "tracks#karaokeeffects"
title = "Scanline tint strength"
zh = "扫描线着色强度"
details = "The right band applies 35% of the tint at the same width."
zh_details = "右侧色带仅混入 35% 的颜色，宽度与左侧相同。"
still = 1.45

[[component]]
id = "sweep-gradient"
group = "sweep"
api = "scanline_material=LyricGradient(...)"
reference = "tracks#karaokeeffects"
title = "Gradient scanline"
zh = "渐变扫描线"
details = "Blend from cyan through pink to gold along the height of the moving band."
zh_details = "移动色带沿字形高度从青色过渡到粉色，再到金色。"
still = 1.45

[[component]]
id = "sweep-feather"
group = "sweep"
api = "hook_feather=24"
reference = "tracks#karaokeeffects"
title = "Feathered wipe edge"
zh = "羽化走字前沿"
details = "Blend waiting and sung colours across 24 px at the wipe front."
zh_details = "唱前色和唱后色在走字前沿的 24 脚本像素内逐渐混合。"
still = 1.45

[[component]]
id = "sweep-front-tint"
group = "sweep"
api = "front_color=CYAN"
reference = "tracks#karaokeeffects"
title = "Tinted wipe edge"
zh = "走字前沿染色"
details = "Both fronts are feathered. The right adds cyan within the transition."
zh_details = "两侧都开启羽化。右侧在过渡区内加入青色。"
still = 1.45

[[component]]
id = "sweep-angle"
group = "sweep"
api = "sweep_angle=28"
reference = "tracks#karaokeeffects"
title = "Tilted sweep front"
zh = "倾斜的走字前沿"
details = "The lettering stays upright while the right front leans 28°."
zh_details = "文字保持正体，右侧的走字前沿倾斜 28°。"
still = 1.45

[[component]]
id = "sweep-reverse"
group = "sweep"
api = "reverse_wipe=True"
reference = "tracks#karaokeeffects"
title = "Right-to-left sweep"
zh = "从右往左走字"
details = "The right preview reverses the sweep within the timed unit and keeps the glyph order."
zh_details = "右侧在计时单元内反向扫色，文字顺序保持不变。"
still = 1.45

[[component]]
id = "sweep-ruby"
group = "sweep"
api = 'ruby_scanline="reading"'
reference = "tracks#karaokeeffects"
title = "Scanline on ruby only"
zh = "扫描线只走注音"
details = "The body and readings share the timing. On the right, only the readings carry the band."
zh_details = "正文和注音共用时间轴。右侧只在注音上绘制扫描线。"
still = 1.45
