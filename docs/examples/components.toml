# Keep these labels aligned with the public KaraokeEffects preset values.
[presets]
none = ["Cut", "直接切换"]
fade = ["Line fade", "整行淡入淡出"]
slide_in = ["Slide in", "滑入"]
slide_out = ["Slide out", "滑出"]
rise = ["Rise", "上移"]
char_fade = ["Staggered fade", "逐字淡入淡出"]
char_drip = ["Character shear", "逐字倾斜"]
spin_flip = ["Spin flip", "旋转翻转"]
utopia = ["Utopia", "Utopia"]
tilt_pop = ["Tilt and pop", "倾斜弹入"]
tracking_in = ["Close letter spacing", "字距收拢"]
converge_out = ["Converge", "向中心合拢"]
wave_in = ["Rising wave", "波浪入场"]
scatter_out = ["Radial scatter", "径向散开"]
stretch_in = ["Stretch in", "拉伸入场"]
stretch_out = ["Stretch out", "拉伸退场"]
glow_in = ["Glow in", "辉光入场"]
glow_out = ["Glow out", "辉光退场"]
assemble_in = ["Particle assembly", "粒子聚合"]
dissolve_out = ["Particle dissolve", "粒子消散"]
sparkle = ["Starburst", "星光迸发"]
ripple = ["Ripples", "涟漪"]
note = ["Musical notes", "音符"]
petal = ["Petals", "花瓣"]
snow = ["Open snowflakes", "镂空雪花"]
snow_solid = ["Solid snowflakes", "实心雪花"]
no_wipe = ["Change colour at note end", "收音时整音节换色"]
scanline = ["Scanline", "扫描线"]
utopia_scanline = ["Utopia pulse with scanline", "Utopia 弹动与扫描线"]
zoom_pulse = ["Zoom on held note", "长音渐进缩放"]
zoom_pulse_scanline = ["Zoom with scanline", "缩放与扫描线"]
twinkle = ["Drifting stars", "漂移星光"]
twinkle_classic = ["Pulsing stars", "呼吸星光"]

# In each group, use either a component_previews.py case or a Gallery demo.
# The last fields select its playback window and poster in seconds.
[[component]]
id = "default-recipe"
group = "highlight"
api = "KaraokeEffects()"
reference = "tracks#karaokeeffects"
title = "Default karaoke recipe"
zh = "默认卡拉 OK 预设"

[[component]]
id = "duotone"
