summary = "自定义 WGSL 着色器让动态光带扫过文字填充。"
details = "自定义 WGSL 着色器读取字形局部坐标与经过秒数来计算波纹，将新色调混入文字填充并保留原始透明度。拖动两个控件即可实时更新具名材质参数。"

[demo.zh-cn.labels]
