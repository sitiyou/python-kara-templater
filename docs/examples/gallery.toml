guide = "guides/text-and-cues/"
accent = "#ffc592"
duration = 5.2
still = 2.45

[demo.zh-cn]
title = "行内与独立倒数提示"
short = "倒数"
category = "装饰"
summary = "行内音量条与独立星形指示灯同频倒数。"
details = "两种提示共用同一个 3 秒倒数时钟：星形灯固定在独立位置逐个熄灭，音量条则嵌入主唱行首并随歌词排版一起移动。"

[[demo]]
