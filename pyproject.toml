[build-system]
requires = ["setuptools>=77", "meson>=1.3; sys_platform == 'win32'", "ninja>=1.11; sys_platform == 'win32'"]
build-backend = "setuptools.build_meta"

[project]
name = "kara-templater"
version = "1.1.1"
description = "Scriptable karaoke effects with WGSL materials, live browser previews, and shader and ASS exports"
requires-python = ">=3.12"
dependencies = ["aggdraw>=1.3.19", "Pillow>=10"]
license = "MIT"
license-files = ["LICENSE", "vendor/runtime-licenses/**/*"]
readme = "README.md"

[project.scripts]
kara-templater = "kara_templater.__main__:main"

[tool.setuptools.packages.find]
include = ["kara_templater", "kara_templater.*"]

[tool.setuptools.package-data]
kara_templater = ["py.typed", "*.pyi", "output/preview/index.html", "output/preview/player.js", "_component_previews/*.json", "_component_previews/*.jpg", "_component_previews/*.mp4"]

[tool.pytest.ini_options]
# Plain pytest exercises the authoring and delivery pipeline. Pass tests/ for all regressions.
testpaths = [
    "tests/test_ass.py",
    "tests/test_fonts.py",
    "tests/test_ass_lyric_sources.py",
    "tests/test_structured_lyrics.py",
    "tests/test_progress_curves.py",
    "tests/test_lyric_layout.py",
    "tests/test_orchestration.py",
    "tests/test_cli_preset.py",
    "tests/test_effect_parameters.py",
    "tests/test_raster.py",
    "tests/test_gpu_scene.py",
]

[tool.cibuildwheel]
build = ["cp3{12,13,14,15}-manylinux_x86_64", "cp3{12,13,14,15}-win_amd64"]
test-sources = ["tests", "examples", "tools", "docs", "skills", "README.md", "LICENSE", "THIRD_PARTY.md", "pyproject.toml", "setup.py"]
test-requires = ["pytest", "fonttools>=4.60", "setuptools>=77", "Pillow>=10", "ty==0.0.106"]
test-command = "python -m pytest tests -v && python -m kara_templater examples/karaoke.ass output.hook"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"
repair-wheel-command = """auditwheel repair --plat manylinux_2_28_x86_64 --only-plat \\
  --exclude 'libharfbuzz.so.*' --exclude 'libfribidi.so.*' \\
  --exclude 'libfontconfig.so.*' --exclude 'libfreetype.so.*' \\
  --exclude 'libglib-2.0.so.*' --exclude 'libgraphite2.so.*' \\
  --exclude 'libexpat.so.*' --exclude 'libz.so.*' --exclude 'libbz2.so.*' \\
  --exclude 'libpng16.so.*' --exclude 'libbrotlidec.so.*' \\
  --exclude 'libbrotlicommon.so.*' --exclude 'libpcre2-8.so.*' \\
  -w {dest_dir} {wheel}"""
before-all = """dnf install -y epel-release && \\
  dnf install -y pkgconf-pkg-config freetype-devel harfbuzz-devel fribidi-devel fontconfig-devel libpng-devel dejavu-sans-fonts dejavu-sans-mono-fonts google-noto-sans-cjk-ttc-fonts && \\
  curl -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.87.0 --no-modify-path"""
environment = {PATH = "/root/.cargo/bin:$PATH"}

[tool.cibuildwheel.windows]
archs = ["AMD64"]
repair-wheel-command = "delvewheel repair --strip --no-mangle libharfbuzz-0.dll -w {dest_dir} {wheel}"

# Keep library typing checks reproducible across local development and CI.
[dependency-groups]
checks = [
    "ruff==0.17.4",
    "ty==0.0.106",
    "pytest>=8",
    "Pillow>=10",
    "setuptools>=77",
    "fonttools>=4.60",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["refs", "vendor", "build", "dist", ".firecrawl"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F",  # Python errors and undefined/unused names
    "I", "UP",               # Imports and modern Python syntax
    "B", "SIM", "C4", "PIE", # Common bugs and unnecessary constructs
    "PGH", "RUF100", "RUF013", # Precise suppressions and explicit Optional
    "ANN201", "ANN204", "ANN205", "ANN206", "ANN401",
]
# Lambda callbacks and short coordinate/layer names are intentional in effects.
ignore = ["E731", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN201", "ANN204", "ANN205", "ANN206"]
"examples/**" = ["ANN201", "ANN204", "ANN205", "ANN206"]
"tools/**" = ["ANN201", "ANN204", "ANN205", "ANN206"]
"setup.py" = ["ANN201", "ANN204", "ANN205", "ANN206"]

[tool.ty.rules]
# Defaults already diagnose incompatible arguments, assignments and returns.
# These additionally prevent dynamic values leaking through declared contracts.
unsound-return = "error"
unsound-assignment = "error"
unsound-yield = "error"
missing-type-argument = "error"
possibly-missing-attribute = "error"
possibly-missing-import = "error"
possibly-unresolved-reference = "error"
division-by-zero = "error"
redundant-cast = "error"
blanket-ignore-comment = "error"
unused-ignore-comment = "error"
unused-type-ignore-comment = "error"

[tool.ty.terminal]
error-on-warning = true
