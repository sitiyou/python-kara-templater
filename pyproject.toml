[build-system]
requires = ["setuptools>=77", "meson>=1.3; sys_platform == 'win32'", "ninja>=1.11; sys_platform == 'win32'"]
build-backend = "setuptools.build_meta"

[project]
name = "kara-templater"
version = "0.1.1"
description = "Python karaoke template engine with native libass text metrics"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "vendor/LICENSE.libass", "vendor/runtime-licenses/**/*"]
readme = "README.md"

[project.scripts]
kara-templater = "kara_templater.__main__:main"

[tool.setuptools]
packages = ["kara_templater"]

[tool.cibuildwheel]
build = ["cp3{12,13,14}-manylinux_x86_64", "cp3{12,13,14}-win_amd64"]
before-build = 'python "{package}/tools/collect_licenses.py"'
test-sources = ["tests", "examples"]
test-command = "python -m unittest discover -s tests -v && python -m kara_templater examples/karaoke.ass output.ass"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"
repair-wheel-command = ""
before-all = "dnf install -y epel-release && dnf install -y autoconf automake libtool nasm pkgconf-pkg-config freetype-devel harfbuzz-devel fribidi-devel fontconfig-devel libpng-devel dejavu-sans-fonts"

[tool.cibuildwheel.windows]
archs = ["AMD64"]
repair-wheel-command = "delvewheel repair --strip --no-mangle libharfbuzz-0.dll -w {dest_dir} {wheel}"
