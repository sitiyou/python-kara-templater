name: Build and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install build twine
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag!r} does not match package version {version!r}")
          PY
      - name: Build source distribution
        run: python -m build --sdist
      - name: Check metadata
        run: python -m twine check --strict dist/*
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool nasm pkg-config \
            libfreetype-dev libharfbuzz-dev libfribidi-dev libfontconfig-dev \
            libpng-dev fonts-dejavu-core
      - name: Install and test source distribution
        run: |
          python -m pip install dist/*.tar.gz
          cd "$(mktemp -d)"
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
          kara-templater "$GITHUB_WORKSPACE/examples/karaoke.ass" output.ass
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    needs: sdist
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist-sdist
          path: dist
      - name: Install Windows native dependencies
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: patch
          pacboy: >-
            gcc:p
            pkgconf:p
            nasm:p
            freetype:p
            harfbuzz:p
            fribidi:p
      - name: Add Windows toolchain to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          "$env:MSYS2_ROOT\ucrt64\bin" >> $env:GITHUB_PATH
          "$env:MSYS2_ROOT\usr\bin" >> $env:GITHUB_PATH
      - name: Install wheel build tools
        run: python -m pip install cibuildwheel==4.2.1 twine
      - name: Build, repair and test wheels
        shell: bash
        run: python -m cibuildwheel --output-dir wheelhouse dist/*.tar.gz
      - name: Check wheel metadata
        shell: bash
        run: python -m twine check --strict wheelhouse/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: dist-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    needs: [sdist, wheels]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/kara-templater
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
