name: Build and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned checkers and typing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group checks aggdraw
      - name: Lint and type-check library, examples, tests, and tools
        run: |
          ruff check .
          ty check

  sdist:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Install build tools
        run: python -m pip install build twine
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag!r} does not match package version {version!r}")
          PY
      - name: Install native and preview build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config \
            libfreetype-dev libharfbuzz-dev libfribidi-dev libfontconfig-dev \
            libpng-dev fonts-dejavu-core fonts-dejavu-extra fonts-noto-cjk \
            ffmpeg mesa-vulkan-drivers
          rustup default 1.87.0
      - name: Build component previews and source distribution
        run: |
          uv sync --locked --python 3.12
          mkdir -p build/release-source
          git archive HEAD | tar -x -C build/release-source
          uv run --no-sync python -m tools.build_component_library --editable \
            --output build/release-source/kara_templater/_component_previews
          python -m build --sdist --outdir dist build/release-source
      - name: Check metadata
        run: python -m twine check --strict dist/*
      - name: Install and test source distribution
        run: |
          python -m pip install --group checks dist/*.tar.gz
          python - <<'PY'
          import shutil
          import subprocess
          import sys
          import tarfile
          import tempfile
          from pathlib import Path

          archive, = Path("dist").glob("*.tar.gz")
          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory)
              with tarfile.open(archive) as source:
                  source.extractall(root / "source", filter="data")
              package, = (root / "source").iterdir()
              check = root / "check"
              check.mkdir()
              for name in ("tests", "examples", "tools", "docs", "skills"):
                  shutil.copytree(package / name, check / name)
              for name in ("setup.py", "README.md", "LICENSE", "THIRD_PARTY.md", "pyproject.toml"):
                  shutil.copy2(package / name, check / name)
              # No kara_templater source directory is copied into the test cwd.
              subprocess.run([sys.executable, "-I", "-c",
                  "from kara_templater import component_catalog, component_preview_resource; "
                  "catalog = component_catalog(); "
                  "card = catalog['cards'][catalog['preferred_cards']['entry-fade']]; "
                  "assert all(component_preview_resource(card[name]).read_bytes() "
                  "for name in ('poster', 'video'))"], cwd=check, check=True)
              subprocess.run([sys.executable, "-m", "pytest", "tests", "-v"], cwd=check, check=True)
              subprocess.run(["kara-templater", "examples/karaoke.ass", "output.hook"], cwd=check, check=True)
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    needs: sdist
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, abi: cp312}
          - {os: ubuntu-latest, abi: cp313}
          - {os: ubuntu-latest, abi: cp314}
          - {os: ubuntu-latest, abi: cp315}
          - {os: windows-latest, abi: all}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v7
        with:
          name: dist-sdist
          path: dist
      - name: Install Windows native dependencies
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          pacboy: >-
            gcc:p
            pkgconf:p
            fontconfig:p
            freetype:p
            harfbuzz:p
            fribidi:p
      - name: Add Windows toolchain to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          "$env:MSYS2_ROOT\ucrt64\bin" >> $env:GITHUB_PATH
          "$env:MSYS2_ROOT\usr\bin" >> $env:GITHUB_PATH
          "$env:pythonLocation" >> $env:GITHUB_PATH
      - name: Install wheel build tools
        run: python -m pip install cibuildwheel==4.3.5 twine
      - name: Install Rust for Windows wheels
        if: runner.os == 'Windows'
        run: rustup default 1.87.0-x86_64-pc-windows-gnu
      - name: Build and test Linux wheels
        if: runner.os == 'Linux'
        env:
          CIBW_BUILD: ${{ matrix.abi }}-manylinux_x86_64
        shell: bash
        run: |
          for attempt in 1 2 3; do
            log_file=$(mktemp)
            if python -m cibuildwheel --output-dir wheelhouse dist/*.tar.gz >"$log_file" 2>&1; then
              cat "$log_file"
              rm "$log_file"
              exit 0
            else
              status=$?
            fi
            cat "$log_file"
            if ! grep -q 'unexpected EOF' "$log_file" || [ "$attempt" -eq 3 ]; then
              rm "$log_file"
              exit "$status"
            fi
            echo "Container image download ended unexpectedly; retrying ($attempt/3)."
            rm "$log_file"
            sleep "$((attempt * 5))"
          done
      - name: Build and repair Windows wheels
        if: runner.os == 'Windows'
        shell: bash
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: gcc
          # aggdraw only rasterizes paths here. Avoid picking up the runner's JDK FreeType DLL.
          CIBW_TEST_ENVIRONMENT: 'AGGDRAW_FREETYPE_ROOT=""'
          CIBW_TEST_COMMAND: >-
            python -m pytest tests/test_wgsl_material.py -q &&
            python -m kara_templater examples/karaoke.ass output.hook
        run: python -m cibuildwheel --output-dir wheelhouse dist/*.tar.gz
      - name: Inspect Windows extension and bundled DLLs
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheels = sorted(Path('wheelhouse').glob('*.whl'))
          for abi in ('cp312', 'cp313', 'cp314', 'cp315'):
              wheel, = (w for w in wheels if w.name.endswith(f'-{abi}-{abi}-win_amd64.whl'))
              with ZipFile(wheel) as archive:
                  files = archive.namelist()
                  assert f'kara_templater/_text_native.{abi}-win_amd64.pyd' in files, wheel
                  assert 'kara_templater/_kara_wgsl.exe' in files, wheel
                  assert 'kara_templater/_component_previews/components.json' in files, wheel
                  assert any(f.lower().endswith('/libharfbuzz-0.dll') for f in files), wheel
          PY
      - name: Check wheel metadata
        shell: bash
        run: python -m twine check --strict wheelhouse/*.whl
      - uses: actions/upload-artifact@v6
        with:
          name: dist-wheels-${{ matrix.os }}-${{ matrix.abi }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    needs: [sdist, wheels]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/kara-templater
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
