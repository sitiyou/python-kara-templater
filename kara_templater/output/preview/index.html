<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karaoke preview</title>
  <style>
    :root { color-scheme: dark; font: 100%/1.5 system-ui, sans-serif; background: #101116; color: #eef0f7; }
    body { margin: 0; padding: clamp(1rem, 4vw, 2.5rem); }
    main { max-width: 65rem; margin: auto; }
    h1 { margin: 0 0 1rem; font-size: clamp(1.5rem, 4vw, 2rem); }
    h2 { font-size: 1rem; margin: 0; }
    kara-preview { display: block; accent-color: #ffc781; }
    canvas { display: block; width: 100%; height: auto; background: #1c1f2a; border-radius: .5rem; cursor: pointer; }
    .preview-controls, .preview-parameters-head { display: flex; align-items: center; gap: .85rem; padding: .75rem 0; }
    .preview-time { min-width: 0; flex: 1; }
    output { font-variant-numeric: tabular-nums; }
    button { border: 1px solid #505668; border-radius: .4rem; background: #242837; color: inherit; font: inherit; cursor: pointer; padding: .35rem .7rem; }
    .preview-play { min-width: 4.5rem; }
    .preview-play .pause, .preview-play[aria-pressed="true"] .play { display: none; }
    .preview-play[aria-pressed="true"] .pause { display: inline; }
    .preview-parameters { margin-top: .5rem; border-top: 1px solid #505668; }
    .preview-fields { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr)); }
    .preview-field { display: grid; min-width: 0; gap: .5rem; margin: 0; padding: .75rem; border: 1px solid #505668; border-radius: .4rem; }
    .preview-field-head, fieldset label { display: flex; gap: .5rem; justify-content: space-between; }
    fieldset input { width: 7rem; max-width: 85%; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>Karaoke preview</h1>
    <kara-preview data-unavailable="The preview could not start. Check that WebGL 2 is enabled in your browser.">
      <canvas width="@WIDTH@" height="@HEIGHT@" role="img" aria-label="Karaoke scene"></canvas>
      <div class="preview-controls" hidden>
        <button class="preview-play" type="button" aria-label="Play" aria-pressed="false">
          <span class="play" aria-hidden="true">Play</span>
          <span class="pause" aria-hidden="true">Pause</span>
        </button>
        <input class="preview-time" type="range" min="0" max="0" value="0" aria-label="Seek preview">
        <output class="preview-position"></output>
      </div>
      <p class="preview-status" role="status">Loading preview…</p>
      <noscript><p>Enable JavaScript to play this preview.</p></noscript>
      <div class="preview-parameters" hidden>
        <div class="preview-parameters-head">
          <h2>Material parameters</h2>
          <button class="preview-reset" type="button" hidden>Reset</button>
        </div>
        <div class="preview-fields"></div>
      </div>
      <!-- preview data -->
    </kara-preview>
  </main>
  <script type="module">
    <!-- preview player -->
  </script>
</body>
</html>
